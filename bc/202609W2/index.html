<title>Tài liệu nội bộ 30Shine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Be+Vietnam+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="gateStyle">
  :root{
    --paper:#eff1ef; --paper-raised:#e5e8e5;
    --text:#241e1b; --text-soft:#5a534d; --text-faint:#8a837c;
    --line:rgba(36,30,27,0.16); --line-strong:rgba(36,30,27,0.30);
    --accent:#a8672e; --accent-ink:#7d4c1f;
    --crit:#a3392b; --crit-wash:rgba(163,57,43,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#201a17; --paper-raised:#2a231f;
      --text:#ece7e0; --text-soft:#b8afa5; --text-faint:#8c8178;
      --line:rgba(236,231,224,0.16); --line-strong:rgba(236,231,224,0.30);
      --accent:#d99a5b; --accent-ink:#e7b27e;
      --crit:#e18072; --crit-wash:rgba(225,128,114,0.15);
    }
  }
  :root[data-theme="dark"]{
    --paper:#201a17; --paper-raised:#2a231f;
    --text:#ece7e0; --text-soft:#b8afa5; --text-faint:#8c8178;
    --line:rgba(236,231,224,0.16); --line-strong:rgba(236,231,224,0.30);
    --accent:#d99a5b; --accent-ink:#e7b27e;
    --crit:#e18072; --crit-wash:rgba(225,128,114,0.15);
  }
  *{box-sizing:border-box;}
  html{background:var(--paper);}
  body{
    margin:0; min-height:100dvh; background:var(--paper); color:var(--text);
    font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif; font-size:16px; line-height:1.6;
    display:grid; place-items:center; padding-block:48px; padding-left:20px; padding-right:20px;
    -webkit-font-smoothing:antialiased;
  }
  .gate{ width:100%; max-width:400px; display:flex; flex-direction:column; gap:22px; }
  .mark{
    font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:0.09em;
    text-transform:uppercase; color:var(--accent-ink);
    display:flex; align-items:center; gap:9px;
  }
  .mark .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none; }
  h1{
    font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:29px; line-height:1.15;
    margin:0; text-wrap:balance; color:var(--text);
  }
  p.dek{ margin:0; font-size:14.5px; color:var(--text-soft); }
  form{ display:flex; flex-direction:column; gap:11px; }
  label{
    font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--text-faint);
  }
  input{
    width:100%; font-family:"IBM Plex Mono",monospace; font-size:15px;
    padding:12px 14px; color:var(--text); background:var(--paper-raised);
    border:1px solid var(--line-strong); border-radius:3px;
  }
  input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  button{
    font-family:"Be Vietnam Pro",sans-serif; font-size:15px; font-weight:500;
    padding:12px 18px; color:var(--paper); background:var(--accent-ink);
    border:1px solid var(--accent-ink); border-radius:3px; cursor:pointer;
  }
  button:hover{ background:var(--accent); border-color:var(--accent); }
  button:disabled{ opacity:0.55; cursor:progress; }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .err{
    font-size:13.5px; color:var(--crit); background:var(--crit-wash);
    border-radius:3px; padding:10px 13px; margin:0;
  }
  .note{
    font-size:12.5px; color:var(--text-faint); border-top:1px solid var(--line);
    padding-top:16px; margin:0;
  }
</style>

<div class="gate">
  <div class="mark"><span class="dot"></span>30Shine · Trải nghiệm khách hàng</div>
  <h1>Tài liệu này được bảo vệ bằng mật khẩu</h1>
  <p class="dek">Nội dung đã được mã hóa AES-256. Nhập mật khẩu để giải mã và đọc ngay trên trình duyệt của bạn.</p>

  <form id="f">
    <label for="pw">Mật khẩu</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">Mở tài liệu</button>
  </form>

  <p class="err" id="err" hidden></p>
  <p class="note">Mật khẩu không được gửi đi đâu cả — việc giải mã diễn ra hoàn toàn trong trình duyệt. Nhập sai không có thông báo về máy chủ.</p>
</div>

  var ITER = 4000000;
  var f = document.getElementById('f');
  var pw = document.getElementById('pw');
  var go = document.getElementById('go');
  var err = document.getElementById('err');

  function fail(msg){ err.textContent = msg; err.hidden = false; go.disabled = false; go.textContent = 'Mở tài liệu'; }

  f.addEventListener('submit', function(e){
    e.preventDefault();
    err.hidden = true;
    if (!window.crypto || !window.crypto.subtle){
      fail('Trình duyệt chặn giải mã. Hãy mở trang qua địa chỉ https:// thay vì mở file trực tiếp từ máy.');
      return;
    }
    go.disabled = true; go.textContent = 'Đang giải mã…';
    var raw = Uint8Array.from(atob(PAYLOAD), function(c){ return c.charCodeAt(0); });
    var salt = raw.slice(0,16), iv = raw.slice(16,28), data = raw.slice(28);
    crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:salt, iterations:ITER, hash:'SHA-256' },
          km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      })
      .then(function(key){ return crypto.subtle.decrypt({ name:'AES-GCM', iv:iv }, key, data); })
      .then(function(buf){
        var html = new TextDecoder().decode(buf);
        var doc = new DOMParser().parseFromString(html, 'text/html');

        // bo giao dien cong mat khau, giu lai khung trang
        var gs = document.getElementById('gateStyle');
        if (gs) gs.parentNode.removeChild(gs);
        if (doc.title) document.title = doc.title;

        Array.prototype.slice.call(doc.head.children).forEach(function(el){
          if (el.tagName === 'TITLE') return;
          document.head.appendChild(document.importNode(el, true));
        });

        document.body.textContent = '';
        Array.prototype.slice.call(doc.body.children).forEach(function(el){
          if (el.tagName === 'SCRIPT') return;
          document.body.appendChild(document.importNode(el, true));
        });

        // script duoc DOMParser tao ra khong tu chay - phai dung lai
        Array.prototype.slice.call(doc.querySelectorAll('script')).forEach(function(s){
          var nx = document.createElement('script');
          if (s.src) { nx.src = s.src; } else { nx.textContent = s.textContent; }
          document.body.appendChild(nx);
        });

        window.scrollTo(0, 0);
      })
      .catch(function(){ fail('Mật khẩu không đúng. Kiểm tra lại giúp bạn nhé.'); pw.select(); });
  });
})();
